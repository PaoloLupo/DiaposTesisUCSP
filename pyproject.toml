[project]
name = "diapostesis"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "gaanim",
]

[tool.pyright]
include = ["src", "main.py"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.15"
reportUnusedCallResult = false
reportImplicitStringConcatenation = false

[dependency-groups]
dev = [
    "pyright==1.1.407",
    "ruff==0.16.9",
]
